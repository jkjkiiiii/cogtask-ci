name: Synthetic checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[dev,notebook]"
      - run: python -m unittest discover -s tests -v
      - run: cogtask-ci demo --output results/ci_demo --subjects 30
      - run: python -m nbconvert --to notebook --execute examples/01_quickstart.ipynb --output-dir results/executed
      - run: python -m nbconvert --to notebook --execute examples/02_task_complementarity.ipynb --output-dir results/executed
      - run: python -m nbconvert --to notebook --execute examples/03_synthetic_showcase.ipynb --output-dir results/executed
      - run: python -m nbconvert --to notebook --execute examples/04_csv_workflow.ipynb --output-dir results/executed
      - run: python -m build
      - run: python scripts/check_repository.py
      - run: python scripts/prepare_release.py --output releases/cogtask-ci-source.zip
